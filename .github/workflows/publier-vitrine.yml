name: Mettre à jour les données pour VITRINE

on:
  push:
    branches: [main]
    paths:
      - CATALOGUE/donnees.js
      - VIGNETTES/*.jpg
      - ANALYSES/*.pdf

permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - name: Lire le catalogue
        uses: actions/checkout@v4

      - name: Préparer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Générer les données lisibles par VITRINE
        run: python CATALOGUE/generer_echange_vitrine.py

      - name: Publier les fichiers mis à jour
        run: |
          if git diff --quiet -- CATALOGUE/catalogue.json CATALOGUE/vitrine.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CATALOGUE/catalogue.json CATALOGUE/vitrine.json
          git commit -m "Mettre à jour les données pour VITRINE"
          git push
