<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalogue ANTIQUITÉS</title>
<style>
:root {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #252522;
  background: #f3f2ee;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; }
header {
  padding: 14px clamp(14px, 3vw, 30px) 11px;
  background: #fff;
  border-bottom: 1px solid #d9d7d0;
}
header h1 { margin: 0; font-size: clamp(19px, 2.4vw, 24px); }
header p { margin: 3px 0 0; color: #6c6961; font-size: 13px; }
main { max-width: 1500px; margin: 0 auto; padding: 12px clamp(10px, 2vw, 22px) 24px; }
.panel { background: #fff; border: 1px solid #d9d7d0; border-radius: 9px; }
.search-panel { padding: 11px; }
.search-bar {
  display: grid;
  grid-template-columns: minmax(240px, 1fr) 110px 110px auto;
  gap: 8px;
  align-items: end;
}
.field label, .criteria-label { display: block; margin-bottom: 4px; color: #615e57; font-size: 12px; }
input[type="number"], input[type="search"] {
  width: 100%;
  height: 34px;
  padding: 6px 9px;
  border: 1px solid #bdbab2;
  border-radius: 6px;
  background: #fff;
  font: inherit;
  font-size: 14px;
}
input:focus-visible, button:focus-visible, summary:focus-visible, .result-row:focus-visible {
  outline: 2px solid #476f86;
  outline-offset: 2px;
}
.controls { display: flex; gap: 6px; }
button {
  min-height: 34px;
  padding: 6px 10px;
  border: 1px solid #aaa69d;
  border-radius: 6px;
  background: #f7f6f2;
  color: inherit;
  cursor: pointer;
  white-space: nowrap;
}
button:hover { background: #eceae3; }
.criteria { margin-top: 9px; }
.groups { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.group { border: 1px solid #dedcd5; border-radius: 6px; overflow: hidden; }
.group summary {
  padding: 6px 8px;
  background: #f7f6f2;
  cursor: pointer;
  font-size: 12px;
  font-weight: 650;
}
.group-body { max-height: 145px; overflow: auto; padding: 4px 8px 6px; }
.choice { display: block; padding: 2px 0; font-size: 12px; line-height: 1.25; }
.choice input { margin: 0 4px 0 0; vertical-align: -1px; }
.logic-note { margin: 7px 1px 0; color: #716e66; font-size: 11px; }
.results-panel { margin-top: 10px; overflow: hidden; }
.result-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 8px 11px;
  border-bottom: 1px solid #dedcd5;
}
.result-head h2 { margin: 0; font-size: 15px; }
#count { color: #69665f; font-size: 12px; }
.result-list { margin: 0; padding: 0; list-style: none; }
.result-list li + li { border-top: 1px solid #e8e6e0; }
.result-row {
  display: block;
  padding: 6px 11px;
  color: #292825;
  text-decoration: none;
  font-size: 13px;
  line-height: 1.25;
}
.result-row:hover { background: #f3f6f7; color: #174e69; }
.result-id { font-weight: 700; }
.separator { color: #99958c; padding: 0 4px; }
.empty { padding: 18px 11px; color: #77736b; font-size: 13px; }
@media (max-width: 980px) {
  .groups { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 720px) {
  .search-bar { grid-template-columns: 1fr 1fr; }
  .field-particularites, .controls { grid-column: 1 / -1; }
}
@media (max-width: 480px) {
  .groups { grid-template-columns: 1fr; }
  .result-row { font-size: 12px; }
}
</style>
</head>
<body>
<header>
  <h1 id="catalogueTitle">Catalogue ANTIQUITÉS</h1>
  <p>Recherche par identification, datation et particularités visuelles.</p>
</header>

<main>
  <section class="panel search-panel" aria-labelledby="searchTitle">
    <h2 id="searchTitle" hidden>Recherche</h2>
    <div class="search-bar">
      <div class="field field-particularites">
        <label for="particularitesSearch">Recherche dans les particularités</label>
        <input id="particularitesSearch" type="search" placeholder="ex. doré, queue, croissant…" autocomplete="off">
      </div>
      <div class="field">
        <label for="dateMin">Date de</label>
        <input id="dateMin" type="number" placeholder="minimum">
      </div>
      <div class="field">
        <label for="dateMax">Date à</label>
        <input id="dateMax" type="number" placeholder="maximum">
      </div>
      <div class="controls">
        <button type="button" id="resetBtn">Tout effacer</button>
        <button type="button" id="showAllBtn">Tout afficher</button>
      </div>
    </div>

    <div class="criteria">
      <span class="criteria-label">Identification</span>
      <div id="groups" class="groups"></div>
      <p class="logic-note">Dans un groupe : OU. Entre les groupes : ET.</p>
    </div>
  </section>

  <section class="panel results-panel" aria-labelledby="resultsTitle">
    <div class="result-head">
      <h2 id="resultsTitle">Objets trouvés</h2>
      <span id="count" aria-live="polite"></span>
    </div>
    <div id="results"></div>
  </section>
</main>

<script src="CATALOGUE/donnees.js"></script>
<script>
const GROUPES_CRITERES = DONNEES_CATALOGUE.groupes;
const OBJETS = DONNEES_CATALOGUE.objets;
const collator = new Intl.Collator('fr', { sensitivity: 'base' });

const groupsEl = document.getElementById('groups');
const resultsEl = document.getElementById('results');
const countEl = document.getElementById('count');
const particularitesSearch = document.getElementById('particularitesSearch');
const dateMin = document.getElementById('dateMin');
const dateMax = document.getElementById('dateMax');
const resetBtn = document.getElementById('resetBtn');
const showAllBtn = document.getElementById('showAllBtn');

document.getElementById('catalogueTitle').textContent =
  `Catalogue ANTIQUITÉS — ${OBJETS.length} objet${OBJETS.length > 1 ? 's' : ''}`;

function valuesFor(field) {
  const vocabulary = DONNEES_CATALOGUE.vocabulaires?.[field];
  const controlledValues = Array.isArray(vocabulary) ? vocabulary : vocabulary?.valeurs;
  return [...new Set(controlledValues || [])]
    .filter(Boolean)
    .sort(collator.compare);
}

Object.entries(GROUPES_CRITERES).forEach(([label, field], index) => {
  const details = document.createElement('details');
  details.className = 'group';
  details.open = index < 2;

  const summary = document.createElement('summary');
  summary.textContent = label;
  const body = document.createElement('div');
  body.className = 'group-body';

  valuesFor(field).forEach(value => {
    const choice = document.createElement('label');
    choice.className = 'choice';
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.dataset.field = field;
    checkbox.value = value;
    checkbox.addEventListener('change', render);
    choice.append(checkbox, document.createTextNode(value));
    body.appendChild(choice);
  });

  details.append(summary, body);
  groupsEl.appendChild(details);
});

[particularitesSearch, dateMin, dateMax].forEach(input => input.addEventListener('input', render));

function normalizeText(value) {
  return String(value || '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toLocaleLowerCase('fr');
}

const SIMPLE_VARIANTS = [
  ['grec', 'grecque', 'grecs', 'grecques'],
  ['romain', 'romaine', 'romains', 'romaines'],
  ['franc', 'franque', 'francs', 'franques'],
  ['gaulois', 'gauloise', 'gauloises']
].map(group => group.map(normalizeText));

function matchesParticularites(particularites, query) {
  const text = normalizeText(particularites);
  if (text.includes(query)) return true;

  return query.split(/\s+/).filter(Boolean).every(term => {
    const variantGroup = SIMPLE_VARIANTS.find(group => group.includes(term));
    return variantGroup
      ? variantGroup.some(variant => text.includes(variant))
      : text.includes(term);
  });
}

function selectedByField() {
  const selected = {};
  groupsEl.querySelectorAll('input[type="checkbox"]:checked').forEach(checkbox => {
    (selected[checkbox.dataset.field] ||= []).push(checkbox.value);
  });
  return selected;
}

function overlaps(object, queryMin, queryMax) {
  if (object.dateMin === null || object.dateMax === null) return false;
  return object.dateMin <= queryMax && object.dateMax >= queryMin;
}

function matches(object, selected, query, queryMin, queryMax, hasDateQuery) {
  for (const [field, selectedValues] of Object.entries(selected)) {
    const objectValues = Array.isArray(object[field]) ? object[field] : [];
    if (!selectedValues.some(value => objectValues.includes(value))) return false;
  }

  if (query && !matchesParticularites(object.particularites, query)) return false;
  if (hasDateQuery && !overlaps(object, queryMin, queryMax)) return false;
  return true;
}

function displayPeriod(object) {
  return object.epoque?.[0] || object.datation || 'Datation à déterminer';
}

function displayDates(object) {
  if (object.dateMin !== null && object.dateMax !== null) {
    return object.dateMin === object.dateMax
      ? String(object.dateMin)
      : `${object.dateMin}–${object.dateMax}`;
  }
  return object.datation || 'À déterminer';
}

function resultRow(object) {
  const item = document.createElement('li');
  const link = document.createElement('a');
  link.className = 'result-row';
  link.href = object.pdf;
  link.target = '_blank';
  link.rel = 'noopener';
  link.title = `Ouvrir le PDF de ${object.id}`;

  const id = document.createElement('span');
  id.className = 'result-id';
  id.textContent = object.id;
  const separator = () => {
    const span = document.createElement('span');
    span.className = 'separator';
    span.textContent = '—';
    return span;
  };

  link.append(
    id,
    separator(),
    document.createTextNode(object.designation),
    separator(),
    document.createTextNode(displayPeriod(object)),
    separator(),
    document.createTextNode(displayDates(object))
  );
  item.appendChild(link);
  return item;
}

function render() {
  const selected = selectedByField();
  const query = normalizeText(particularitesSearch.value.trim());
  const hasDateQuery = dateMin.value !== '' || dateMax.value !== '';
  const queryMin = dateMin.value === '' ? Number.NEGATIVE_INFINITY : Number(dateMin.value);
  const queryMax = dateMax.value === '' ? Number.POSITIVE_INFINITY : Number(dateMax.value);
  const filtered = queryMin > queryMax
    ? []
    : OBJETS.filter(object => matches(object, selected, query, queryMin, queryMax, hasDateQuery));

  countEl.textContent = `${filtered.length} / ${OBJETS.length}`;
  resultsEl.replaceChildren();

  if (!filtered.length) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = 'Aucun objet ne correspond.';
    resultsEl.appendChild(empty);
    return;
  }

  const list = document.createElement('ul');
  list.className = 'result-list';
  filtered.forEach(object => list.appendChild(resultRow(object)));
  resultsEl.appendChild(list);
}

function clearFilters() {
  particularitesSearch.value = '';
  dateMin.value = '';
  dateMax.value = '';
  groupsEl.querySelectorAll('input[type="checkbox"]').forEach(checkbox => { checkbox.checked = false; });
}

function clearResults() {
  countEl.textContent = `0 / ${OBJETS.length}`;
  const empty = document.createElement('div');
  empty.className = 'empty';
  empty.textContent = 'Aucun objet affiché.';
  resultsEl.replaceChildren(empty);
}

resetBtn.addEventListener('click', () => {
  clearFilters();
  clearResults();
  particularitesSearch.focus();
});

showAllBtn.addEventListener('click', () => {
  clearFilters();
  render();
  particularitesSearch.focus();
});

render();
</script>
</body>
</html>
